spring.application.name=probability-lab
spring.main.banner-mode=off

# Порт можна змінити під час запуску: java -jar probability-lab.jar --server.port=9090
server.port=8080
# Слухаємо всі мережеві інтерфейси, щоб учні могли під'єднатися з планшетів у шкільній мережі
server.address=0.0.0.0
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

spring.web.resources.cache.period=0
logging.level.root=WARN
logging.level.ua.problab=INFO
